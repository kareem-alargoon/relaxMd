name: relaxmd
description: Calm right-to-left Markdown reader and editor.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  markdown: '>=7.2.2 <8.0.0'
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: '>=8.1.2 <11.0.0'
  google_fonts: '>=6.2.1 <8.0.0'

# Newer Android halves of these plugins call Java/Kotlin from Dart over JNI. R8 can't
# see those calls, so the release build strips the classes they need and the app fails
# at startup (NoSuchMethodError on SharedPreferencesApiRegistrar.getAll, then
# ClassNotFoundException for kotlin.coroutines.intrinsics.CoroutineSingletons).
# Stay on the last method-channel releases until the plugins ship keep rules.
dependency_overrides:
  shared_preferences_android: 2.4.28
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
